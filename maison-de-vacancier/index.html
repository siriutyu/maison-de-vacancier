
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // ★ここを自分のSupabase情報に置き換える
  const SUPABASE_URL = "https://hyywkocnnujkyhsklgar.supabase.co";
  const SUPABASE_KEY = "sb_publishable_N8CsUHgnLCCDb7SKNCreWQ_0yHS2_jy";
  const ADMIN_UID = "303eb34e-0ffd-4c8f-a521-a002dcfbf970";

  if (
    SUPABASE_URL.startsWith("YOUR_") ||
    SUPABASE_KEY.startsWith("YOUR_")
  ) return;

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) =>
    [...root.querySelectorAll(s)];

  // 元ページのDOM構造を基準にIDを割り当てる
  $$("body *").forEach((el, i) => {
    el.dataset.veid = String(i);
  });

  let edits = {};
  let selected = null;
  let editing = false;
  let currentUser = null;
  let originalContent = {};

  const style = document.createElement("style");
  style.textContent = `
    #ve-toggle {
      position: fixed; right: 16px; bottom: 16px; z-index: 99999;
      border: 0; border-radius: 999px; padding: 13px 19px;
      background: #9b6bff; color: white; font: inherit;
      font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 18px #0005;
    }
    #ve-panel {
      position: fixed; z-index: 100000; right: 12px; bottom: 72px;
      width: min(360px, calc(100vw - 24px));
      max-height: min(78vh, 700px); overflow: auto;
      padding: 18px; border-radius: 16px;
      background: #211b30; color: #fff;
      border: 1px solid #7252a0; box-shadow: 0 8px 40px #0008;
      font: 14px/1.5 system-ui, sans-serif;
    }
    #ve-panel * { box-sizing: border-box; }
    #ve-panel input, #ve-panel button {
      font: inherit; max-width: 100%;
    }
    #ve-panel input[type="email"],
    #ve-panel input[type="password"],
    #ve-panel input[type="url"],
    #ve-panel input[type="text"] {
      width: 100%; padding: 9px; margin: 5px 0 10px;
      border: 1px solid #7252a0; border-radius: 7px;
      background: #17102b; color: white;
    }
    #ve-panel input[type="color"] {
      width: 48px; height: 32px; vertical-align: middle;
    }
    #ve-panel button {
      padding: 8px 10px; margin: 3px;
      border: 0; border-radius: 7px; cursor: pointer;
      background: #9b6bff; color: white;
    }
    #ve-panel button.secondary { background: #443653; }
    #ve-panel label { display: block; margin-top: 9px; }
    #ve-panel small { color: #d4c4ed; }
    #ve-status { white-space: pre-wrap; overflow-wrap: anywhere; }
    [data-ve-selected="true"] {
      outline: 3px solid #ff8a1f !important;
      outline-offset: 2px;
      cursor: crosshair !important;
    }
    body.ve-editing [data-veid] { cursor: crosshair; }
    body.ve-editing #ve-panel,
    body.ve-editing #ve-toggle { cursor: auto; }
  `;
  document.head.appendChild(style);

  const toggle = document.createElement("button");
  toggle.id = "ve-toggle";
  toggle.textContent = "✎ 編集モード";
  document.body.appendChild(toggle);

  const panel = document.createElement("aside");
  panel.id = "ve-panel";
  panel.hidden = true;
  panel.innerHTML = `
    <h2 style="margin-top:0">サイト編集</h2>
    <div id="ve-login">
      <p>管理者ログイン</p>
      <form id="ve-login-form">
        <label>メールアドレス
          <input id="ve-email" type="email" required autocomplete="username">
        </label>
        <label>パスワード
          <input id="ve-password" type="password" required autocomplete="current-password">
        </label>
        <button>ログイン</button>
      </form>
    </div>
    <div id="ve-tools" hidden>
      <p>ページ内の変更したい場所をクリックするのだ。</p>
      <p><small id="ve-selected-label">選択なし</small></p>

      <label>文章（文字だけの要素）
        <input id="ve-text" type="text">
      </label>
      <button id="ve-text-apply">文章を適用</button>

      <label>リンク先URL
        <input id="ve-href" type="url" placeholder="https://...">
      </label>
      <button id="ve-href-apply">リンクを適用</button>

      <label>画像URL
        <input id="ve-src" type="url" placeholder="https://.../image.png">
      </label>
      <button id="ve-src-apply">画像を適用</button>

      <label>文字色 <input id="ve-color" type="color" value="#ffffff"></label>
      <button id="ve-color-apply">文字色を適用</button>

      <label>背景色 <input id="ve-bg" type="color" value="#241a42"></label>
      <button id="ve-bg-apply">背景色を適用</button>

      <label>幅（例：100%、80%、auto）
        <input id="ve-width" type="text" placeholder="変更しない">
      </label>
      <button id="ve-width-apply">幅を適用</button>

      <hr style="border-color:#57476d;margin:16px 0">
      <p>セクションの並び替え</p>
      <button id="ve-up" class="secondary">↑ 上へ</button>
      <button id="ve-down" class="secondary">↓ 下へ</button>

      <hr style="border-color:#57476d;margin:16px 0">
      <button id="ve-save">変更を保存</button>
      <button id="ve-reload" class="secondary">保存内容を再読込</button>
      <button id="ve-exit" class="secondary">編集終了</button>
      <button id="ve-logout" class="secondary">ログアウト</button>
    </div>
    <p id="ve-status" role="status">準備中...</p>
  `;
  document.body.appendChild(panel);

  const status = (msg) => { $("#ve-status").textContent = msg; };

  function chooseTarget(el) {
    if (!el || panel.contains(el) || el === toggle) return null;
    return el.closest("a, h1, h2, h3, p, li, dt, dd, button, img, section")
      || el;
  }

  function selectElement(el) {
    if (selected) selected.removeAttribute("data-ve-selected");
    selected = el;
    if (!selected) return;

    selected.setAttribute("data-ve-selected", "true");
    $("#ve-selected-label").textContent =
      `<${selected.tagName.toLowerCase()}> #${selected.dataset.veid}`;

    $("#ve-text").value = selected.children.length
      ? "" : selected.textContent.trim();

    $("#ve-href").value =
      selected instanceof HTMLAnchorElement ? selected.href : "";

    $("#ve-src").value =
      selected instanceof HTMLImageElement ? selected.src : "";

    $("#ve-color").value = toHex(getComputedStyle(selected).color)
      || "#ffffff";
    $("#ve-bg").value = toHex(getComputedStyle(selected).backgroundColor)
      || "#241a42";
    $("#ve-width").value = selected.style.width || "";
  }

  function toHex(value) {
    const m = value.match(/\d+/g);
    if (!m || m.length < 3) return "";
    return "#" + m.slice(0, 3)
      .map(n => Number(n).toString(16).padStart(2, "0"))
      .join("");
  }

  function recordStyle(prop, value) {
    if (!selected) return;
    const id = selected.dataset.veid;
    edits[id] ||= {};
    edits[id].style ||= {};
    edits[id].style[prop] = value;
  }

  function applySavedEdits() {
    for (const [id, change] of Object.entries(edits)) {
      const el = $(`[data-veid="${id}"]`);
      if (!el) continue;

      if (typeof change.text === "string") el.textContent = change.text;
      if (typeof change.href === "string" && el.tagName === "A")
        el.setAttribute("href", change.href);
      if (typeof change.src === "string" && el.tagName === "IMG")
        el.setAttribute("src", change.src);

      if (change.style) {
        for (const [prop, value] of Object.entries(change.style)) {
          el.style[prop] = value;
        }
      }
    }

    const order = originalContent.sectionOrder;
    if (Array.isArray(order)) {
      const panels = $$(".panel");
      if (panels.length) {
        const parent = panels[0].parentElement;
        const byId = new Map(panels.map(el => [el.dataset.veid, el]));
        const anchor = parent.querySelector(".cta");
        order.forEach(id => {
          const el = byId.get(String(id));
          if (el && el.parentElement === parent)
            parent.insertBefore(el, anchor || null);
        });
      }
    }
  }

  function endEditing() {
    editing = false;
    document.body.classList.remove("ve-editing");
    if (selected) selected.removeAttribute("data-ve-selected");
    selected = null;
    toggle.textContent = "✎ 編集モード";
    panel.hidden = true;
  }

  toggle.addEventListener("click", async () => {
    panel.hidden = !panel.hidden;
    if (panel.hidden) {
      endEditing();
      return;
    }

    if (!currentUser) {
      $("#ve-login").hidden = false;
      $("#ve-tools").hidden = true;
      status("管理者としてログインしてください。");
      return;
    }

    editing = true;
    document.body.classList.add("ve-editing");
    $("#ve-login").hidden = true;
    $("#ve-tools").hidden = false;
    toggle.textContent = "✕ 編集を閉じる";
    status("編集する場所をクリックしてください。");
  });

  $("#ve-login-form").addEventListener("submit", async e => {
    e.preventDefault();
    status("ログイン中...");

    const { data, error } = await db.auth.signInWithPassword({
      email: $("#ve-email").value.trim(),
      password: $("#ve-password").value
    });

    if (error) {
      status("ログイン失敗: " + error.message);
      return;
    }

    if (data.user.id !== ADMIN_UID) {
      await db.auth.signOut();
      status("このアカウントは管理者ではありません。");
      return;
    }

    currentUser = data.user;
    $("#ve-login").hidden = true;
    $("#ve-tools").hidden = false;
    editing = true;
    document.body.classList.add("ve-editing");
    toggle.textContent = "✕ 編集を閉じる";
    status("ログイン成功！ 編集する場所をクリックするのだ。");
  });

  document.addEventListener("click", e => {
    if (!editing || panel.contains(e.target) || e.target === toggle)
      return;

    const el = chooseTarget(e.target);
    if (!el) return;

    e.preventDefault();
    e.stopImmediatePropagation();
    selectElement(el);
    status("選択中の場所を右側のパネルで編集できます。");
  }, true);

  $("#ve-text-apply").onclick = () => {
    if (!selected) return status("先に編集したい場所をクリックしてね。");
    if (selected.children.length)
      return status("この要素には子要素があります。文章を壊さないよう、この欄での編集はできません。");

    const value = $("#ve-text").value;
    selected.textContent = value;
    edits[selected.dataset.veid] ||= {};
    edits[selected.dataset.veid].text = value;
    status("文章を変更しました。保存ボタンで確定してね。");
  };

  $("#ve-href-apply").onclick = () => {
    if (!(selected instanceof HTMLAnchorElement))
      return status("リンクをクリックして選択してください。");

    const value = $("#ve-href").value.trim();
    if (!/^https?:\/\//i.test(value))
      return status("リンクは https:// または http:// から入力してください。");

    selected.setAttribute("href", value);
    edits[selected.dataset.veid] ||= {};
    edits[selected.dataset.veid].href = value;
    status("リンク先を変更しました。");
  };

  $("#ve-src-apply").onclick = () => {
    if (!(selected instanceof HTMLImageElement))
      return status("画像をクリックして選択してください。");

    const value = $("#ve-src").value.trim();
    if (!/^https:\/\//i.test(value))
      return status("画像URLは https:// から入力してください。");

    selected.setAttribute("src", value);
    edits[selected.dataset.veid] ||= {};
    edits[selected.dataset.veid].src = value;
    status("画像URLを変更しました。");
  };

  $("#ve-color-apply").onclick = () => {
    if (!selected) return status("先に場所を選択してください。");
    selected.style.color = $("#ve-color").value;
    recordStyle("color", selected.style.color);
    status("文字色を変更しました。");
  };

  $("#ve-bg-apply").onclick = () => {
    if (!selected) return status("先に場所を選択してください。");
    selected.style.backgroundColor = $("#ve-bg").value;
    recordStyle("backgroundColor", selected.style.backgroundColor);
    status("背景色を変更しました。");
  };

  $("#ve-width-apply").onclick = () => {
    if (!selected) return status("先に場所を選択してください。");
    const value = $("#ve-width").value.trim();
    if (!/^(auto|\d{1,3}(\.\d+)?%)$/.test(value))
      return status("幅は auto、または 1%〜100% の形式で入力してください。");
    selected.style.width = value;
    recordStyle("width", value);
    status("幅を変更しました。");
  };

  function moveSection(direction) {
    if (!selected) return status("先にセクションを選択してください。");
    const section = selected.closest(".panel");
    if (!section) return status("タブ内のセクションを選択してください。");

    const panels = $$(".panel").filter(el =>
      el.parentElement === section.parentElement
    );
    const index = panels.indexOf(section);
    const next = panels[index + direction];
    if (!next) return status("これ以上移動できません。");

    if (direction < 0) section.parentElement.insertBefore(section, next);
    else section.parentElement.insertBefore(next, section);

    originalContent.sectionOrder = $$(".panel")
      .filter(el => el.parentElement === section.parentElement)
      .map(el => el.dataset.veid);

    status("セクションの順番を変更しました。保存してね。");
  }

  $("#ve-up").onclick = () => moveSection(-1);
  $("#ve-down").onclick = () => moveSection(1);

  $("#ve-save").onclick = async () => {
    if (!currentUser || currentUser.id !== ADMIN_UID)
      return status("管理者ログインが必要です。");

    status("保存中...");
    const { data, error: readError } = await db
      .from("site_content")
      .select("content")
      .eq("id", 1)
      .single();

    if (readError) return status("読み込みエラー: " + readError.message);

    const content = {
      ...(data.content || {}),
      visual_edits: edits
    };

    if (originalContent.sectionOrder)
      content.sectionOrder = originalContent.sectionOrder;

    const { error } = await db
      .from("site_content")
      .update({ content })
      .eq("id", 1);

    if (error) return status("保存エラー: " + error.message);
    status("保存成功！ 公開サイトに変更を保存しました。");
  };

  $("#ve-reload").onclick = async () => {
    if (!confirm("保存されていない変更は失われます。再読み込みしますか？"))
      return;
    location.reload();
  };

  $("#ve-exit").onclick = endEditing;

  $("#ve-logout").onclick = async () => {
    await db.auth.signOut();
    currentUser = null;
    endEditing();
    status("ログアウトしました。");
  };

  async function init() {
    const { data: sessionData } = await db.auth.getSession();
    if (sessionData.session?.user?.id === ADMIN_UID)
      currentUser = sessionData.session.user;

    const { data, error } = await db
      .from("site_content")
      .select("content")
      .eq("id", 1)
      .maybeSingle();

    if (error) {
      status("保存内容の読み込みに失敗しました: " + error.message);
      return;
    }

    originalContent = data?.content || {};
    edits = originalContent.visual_edits || {};
    applySavedEdits();

    status("準備完了。編集モードを押して始めよう。");
  }

  init().catch(error => status("エラー: " + error.message));
})();
</script>
